<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity Profile - HelpHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1><img src="images/logo.png" alt="HelpHub Logo" width="150"></h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="charities.html">Charities</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="charity-details">
            <h2>Animal Rescue Center</h2>
            <img src="images/animal-rescue.jpg" alt="Animal Rescue" width="300">
            <p>Helping animals in need since 2015. Volunteers needed for dog walking, adoption events, and fundraising.</p>
            <form class="volunteer-form">
                <h3>Sign Up to Volunteer</h3>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="availability">Availability:</label>
                <input type="text" id="availability" name="availability">

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 HelpHub</p>
        <nav>
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
        </nav>
    </footer>
</body>
</html>
